tool:
  id: audion_docs_ai
  name: "Audion Docs AI v3"
  category: "Document audit"
  version: "3.1-gui"

paths:
  input: "input"
  output: "output"
  logs: "logs"
  report: "report"
  workspace: "workspace"
  work: "work"
  config: "config"
  release: "release"

ui:
  title: "Audion Docs AI v3"
  host: "127.0.0.1"
  port: 8080
  native: false
  reload: false
  open_browser: false

operations:
  - id: validate_input
    title: "Check input"
    title_ru: "Проверить input"
    description: "List staged DOCX/PPTX/XLSX/PDF files without calling any LLM provider."
    description_ru: "Показать DOCX/PPTX/XLSX/PDF в input без обращения к LLM-провайдерам."
    service: "system_core.services.audion_docs_service:validate_input"
    kind: "safe"

operation_groups:
  - id: prepare
    title: "Prepare"
    title_ru: "Подготовка"
    description: "Scan input and build Office COM render maps."
    description_ru: "Проверка input и построение карты рендера через Office COM."
    children:
      - id: validate_input
        title: "Check input"
        title_ru: "Проверить input"
        description: "List staged DOCX/PPTX/XLSX/PDF files without calling providers."
        description_ru: "Показать DOCX/PPTX/XLSX/PDF в input без вызова провайдеров."
        service: "system_core.services.audion_docs_service:validate_input"
        kind: "safe"
      - id: pipeline_scan
        title: "Scan input"
        title_ru: "Сканировать input"
        description: "Run pipeline scan and write logs/scan.json."
        description_ru: "Запустить сканирование и записать logs/scan.json."
        service: "system_core.services.audion_docs_service:run_pipeline_operation"
        kind: "safe"
        parameters:
          mode: "scan"
      - id: pipeline_render
        title: "COM render-map"
        title_ru: "Карта рендера COM"
        description: "Create marked OOXML, PDF exports, extracted PDF text, and render maps."
        description_ru: "Создать marked OOXML, PDF, извлечённый текст PDF и карту рендера."
        service: "system_core.services.audion_docs_service:run_pipeline_operation"
        kind: "safe"
        parameters:
          mode: "render"

  - id: task_openai
    title: "Task OpenAI"
    title_ru: "ЗАДАЧА ДЛЯ OPENAI"
    description: "Run the selected document task with OpenAI and write DOCX/XLSX/MD/JSON reports."
    description_ru: "Запустить выбранную задачу документов через OpenAI и записать DOCX/XLSX/MD/JSON отчёты."
    service: "system_core.services.audion_docs_service:run_doc_task_operation"
    kind: "safe"
    parameters:
      mode: "run_doc_task"
      provider: "openai"
      model_tier: "audit"
    fields:
      - id: doc_task_ref
        type: "select"
        label: "Task instruction"
        label_ru: "Инструкция задачи"
        default: ""
        searchable: true
        options_source: "system_core.services.audion_docs_service:doc_task_options"
        cache_seconds: 30
        hint: "Loaded from config/doc_tasks; empty value uses active_doc_task.md."
        hint_ru: "Список из config/doc_tasks; пустое значение берёт active_doc_task.md."
      - id: doc_task_pin
        type: "checkbox"
        label: "Favorite instruction"
        label_ru: "Инструкцию в избранное"
        default: false
      - id: doc_task_scope
        type: "select"
        label: "Task scope"
        label_ru: "Охват задачи"
        default: "auto"
        options:
          - value: "auto"
            label: "Auto"
            label_ru: "Авто"
          - value: "corpus"
            label: "Whole input corpus"
            label_ru: "Весь корпус input"
          - value: "document"
            label: "Each file separately"
            label_ru: "Каждый файл отдельно"
        hint: "Auto uses one corpus run for multiple files, but keeps exact replacements per file."
        hint_ru: "Авто запускает один корпусный проход для нескольких файлов, но точные замены оставляет пофайловыми."
      - id: doc_task_query
        type: "textarea"
        label: "Request"
        label_ru: "Уточнение к TASK"
        default: ""
        placeholder: "Например: вывести все упомянутые объекты здравоохранения или заменить 'ошбка' на 'ошибка'."
        span: "full"
      - id: doc_task_apply_replacements
        type: "checkbox"
        label: "Find and replace text in DOCX documents"
        label_ru: "Найти и заменить текст в документах DOCX"
        default: false
        span: "full"
      - id: pdf_max_pages
        type: "number"
        label: "PDF pages"
        label_ru: "Страниц PDF"
        default: 5
        min: 1
        max: 200
        step: 1
        advanced: true
        hint: "For TASK PDF inputs, read only the first N pages."
        hint_ru: "Для PDF во входе TASK читать только первые N страниц."
      - id: doc_task_clean_table
        type: "checkbox"
        label: "Clean table from template"
        label_ru: "Чистая таблица по шаблону"
        default: false
        span: "full"
        hint: "Write an additional clean XLSX, and a filled DOCX copy when the template is DOCX."
        hint_ru: "Записать дополнительный чистый XLSX и заполненную DOCX-копию, если шаблон DOCX."
      - id: doc_task_template_file
        type: "select"
        label: "Table template"
        label_ru: "Шаблон таблицы"
        default: ""
        searchable: true
        options_source: "system_core.services.audion_docs_service:template_file_options"
        cache_seconds: 30
        advanced: true
        hint: "Empty value auto-detects the only DOCX/XLSX template in input."
        hint_ru: "Пустое значение автоматически берёт единственный DOCX/XLSX-шаблон из input."
      - id: openai_api_key_ref
        type: "select"
        label: "OpenAI API key"
        label_ru: "Ключ OpenAI"
        default: ""
        searchable: true
        options_source: "system_core.services.audion_docs_service:openai_api_key_options"
        cache_seconds: 30
      - id: openai_model
        type: "select"
        label: "OpenAI model"
        label_ru: "Модель OpenAI"
        default: ""
        searchable: true
        options_source: "system_core.services.audion_docs_service:openai_model_options"
        cache_seconds: 3600
      - id: openai_model_override
        type: "text"
        label: "Manual model override"
        label_ru: "Модель вручную"
        default: ""
      - id: openai_chunk_tokens
        type: "number"
        label: "Chunk tokens"
        label_ru: "Размер чанка"
        default: 12000
        min: 1000
        max: 100000
        step: 500
      - id: openai_overlap_tokens
        type: "number"
        label: "Overlap tokens"
        label_ru: "Перекрытие"
        default: 0
        min: 0
        max: 20000
        step: 100
      - id: openai_min_chunks
        type: "number"
        label: "Min chunks"
        label_ru: "Мин. частей"
        default: 1
        min: 1
        max: 20
        step: 1
      - id: openai_workers
        type: "number"
        label: "Workers"
        label_ru: "Многозадачность"
        default: 4
        min: 1
        max: 32
        step: 1
        hint: "Chunks at a time"
        hint_ru: "Частей за раз"
      - id: openai_max_retries
        type: "number"
        label: "Max retries"
        label_ru: "Повторы"
        default: 1
        min: 0
        max: 20
        step: 1
      - id: openai_max_output_tokens
        type: "number"
        label: "Max output"
        label_ru: "Макс. вывод"
        default: 32000
        min: 1000
        max: 100000
        step: 500
      - id: openai_timeout_sec
        type: "number"
        label: "Timeout sec"
        label_ru: "Таймаут, сек"
        default: 240
        min: 30
        max: 3600
        step: 30
      - id: openai_resume
        type: "checkbox"
        label: "Resume cache"
        label_ru: "Возобновлять из кэша"
        default: true
    children:
      - id: pin_task_openai_key
        title: "Favorite API key"
        title_ru: "ДОБАВИТЬ КЛЮЧ В ИЗБРАННОЕ"
        description: "Save the selected OpenAI API key as a favorite without running the task."
        description_ru: "Сохранить выбранный ключ OpenAI в избранное без запуска TASK."
        service: "system_core.services.audion_docs_service:run_pipeline_operation"
        kind: "safe"
        parameters:
          mode: "pin_api_key"
          provider: "openai"
      - id: pin_task_openai_model
        title: "Favorite model"
        title_ru: "ДОБАВИТЬ МОДЕЛЬ В ИЗБРАННОЕ"
        description: "Save the selected OpenAI model as a favorite without running the task."
        description_ru: "Сохранить выбранную модель OpenAI в избранное без запуска TASK."
        service: "system_core.services.audion_docs_service:run_pipeline_operation"
        kind: "safe"
        parameters:
          mode: "pin_model"
          provider: "openai"
          model_tier: "audit"
      - id: check_task_openai_model
        title: "Check model"
        title_ru: "ПРОВЕРИТЬ МОДЕЛЬ"
        description: "Send one tiny OpenAI request and cache the selected model status."
        description_ru: "Отправить один маленький запрос OpenAI и сохранить статус выбранной модели."
        service: "system_core.services.audion_docs_service:run_doc_task_operation"
        kind: "safe"
        parameters:
          mode: "check_model"
          provider: "openai"
          model_tier: "audit"
      - id: run_task_openai
        title: "Run"
        title_ru: "ЗАПУСТИТЬ"
        description: "Run the selected document task with OpenAI and write DOCX/XLSX/MD/JSON reports."
        description_ru: "Запустить выбранную задачу документов через OpenAI и записать DOCX/XLSX/MD/JSON отчёты."
        service: "system_core.services.audion_docs_service:run_doc_task_operation"
