# Карта ручного восстановления для правок "регистр после запятых".
#
# Скрипт применяет карту только к срабатываниям из JSON-отчёта DocFlow и
# только после проверки позиции в исходном и исправленном DOCX.
#
# Активные примеры:
#
# restore_words:
#   ясенево: Ясенево
#   подмосковье: Подмосковье
#
# restore_phrases:
#   санкт-петербурге: Санкт-Петербурге
#   краснодарский край: Краснодарский край
#
restore_words: {}
restore_phrases: {}
