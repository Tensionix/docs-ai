schema_version: 3

active_provider: openai
provider_fallback: gemini
retries_before_fallback: 2

providers:
  openai:
    api_key_file: api_key_openai.txt
    api_key_env: OPENAI_API_KEY
    service_tier: default

  gemini:
    api_key_file: api_key_gemini.txt
    api_key_env: GEMINI_API_KEY

  xai:
    api_key_file: api_key_xai.txt
    api_key_env: XAI_API_KEY

  anthropic:
    api_key_file: api_key_anthropic.txt
    api_key_env: ANTHROPIC_API_KEY

# Explicit application defaults. A non-empty GUI selection or manual override
# still wins for an individual run.
models:
  openai:
    audit: gpt-5.6-luna
  gemini:
    audit_fast: gemini-3.6-flash
  xai:
    audit: grok-4.3
  anthropic:
    audit: claude-sonnet-5

audit:
  openai:
    chunk_tokens: 12000
    overlap_tokens: 1200
    min_chunks: 4
    max_retries: 3
    max_output_tokens: 32000
    timeout_medium_sec: 420
    timeout_high_sec: 600
    reasoning_low: low
    reasoning_medium: medium
    reasoning_high: high

  gemini:
    chunk_tokens: 12000
    overlap_tokens: 1200
    max_retries: 4

  xai:
    chunk_tokens: 12000
    overlap_tokens: 1200
    min_chunks: 4
    max_retries: 3
    max_output_tokens: 32000
    timeout_sec: 600

  anthropic:
    chunk_tokens: 12000
    overlap_tokens: 1200
    min_chunks: 4
    max_retries: 3
    max_output_tokens: 32000
    timeout_sec: 900

generation:
  max_retries: 6

prompts:
  audit_system: audit_system_prompt.md
  audit_user: audit_user_prompt.md
  extraction_ocr: ocr_prompt.md
